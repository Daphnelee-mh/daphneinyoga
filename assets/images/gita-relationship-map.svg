<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(13, 13, 13)" viewBox="0 0 760 520" width="100%" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#6B7280" stroke-width="2"><line x1="380" y1="85" x2="160" y2="150"/><line x1="380" y1="85" x2="600" y2="150"/><line x1="380" y1="85" x2="380" y2="150"/><line x1="540" y1="70" x2="450" y2="150"/><line x1="160" y1="240" x2="380" y2="300"/><line x1="600" y1="240" x2="380" y2="300"/><line x1="160" y1="240" x2="90" y2="340"/></g><g fill="#FFFFFF" stroke="#6B7280" stroke-width="2"><rect x="280" y="25" width="200" height="60" rx="12"/><rect x="480" y="20" width="200" height="70" rx="12"/><rect x="50" y="150" width="220" height="90" rx="12"/><rect x="490" y="150" width="220" height="90" rx="12"/><rect x="305" y="150" width="150" height="80" rx="12"/><rect x="250" y="300" width="260" height="120" rx="12"/><rect x="20" y="340" width="140" height="90" rx="12"/></g><g fill="#1F2937" font-family="Georgia, serif"><text x="380" y="50" text-anchor="middle" font-size="18" font-weight="bold">Kurukshetra</text><text x="380" y="68" text-anchor="middle" font-size="12">The battlefield where the Gita begins</text><text x="580" y="42" text-anchor="middle" font-size="15" font-weight="bold">Dhritarashtra</text><text x="580" y="60" text-anchor="middle" font-size="12">Blind King of</text><text x="580" y="76" text-anchor="middle" font-size="12">Hastinapura</text><text x="160" y="175" text-anchor="middle" font-size="16" font-weight="bold">Pandavas</text><text x="160" y="198" text-anchor="middle" font-size="13">Yudhishthira • Bhima</text><text x="160" y="216" text-anchor="middle" font-size="13">Arjuna • Nakula • Sahadeva</text><text x="600" y="175" text-anchor="middle" font-size="16" font-weight="bold